<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tabelas</title>
    </head>
    <body>

        <h1>Tabelas</h1>

        <!--
            table -> tabela
            tr -> table row -> (linha da tabela)
            td -> table data -> (dados da tabela) * table cell (célula da tabela)
            th -> table header -> (cabeçalho da tabela)
        
        -->
        <!-- Não ultilizar o border, apenas para fins de estudo mais a frente iremos utilizar CSS
        -->

        <table border="1">
            <tr>
                Conteúdo
            </tr>
        </table>

    </body>
</html>
