<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatação de Textos</title>
</head>
<body>

    <!-- <b> (bolde - negrito) representa um texto diferente do normal
    <strong> (forter) representa um texto com importância
    <em> (emphasis - ênfase) coloca alguma ênfase no texto
    <mark> (marca) representa o texto marcado 
    -->   
<h2>Formatações de textos</h2>
Esse texto está em <b>negrito</b> <br> 
Esse texto está em <strong>importante</strong> <br>
Esse texto está em <i>itálico</i> <br>
Esse texto está em <em>ênfase</em> <br>
Esse texto está em <mark>marcado</mark> <br>

<!-- 
    <small> (pequeno) representa um texto pequeno
    <del> (deletado) representa um texto deletado
    <ins> (inserido) representa um texto inserido
    <sub> (subscrito) representa um texto subscrito
    <sup> (sobrescrito) representa um texto sobrescrito
    -->
    
    Esse texto está em <small>pequeno</small> <br>
    Esse texto está <del>deletado</del> <br>
    Esse texto está <ins>inserido</ins> <br>
    Esse texto está <sub>subscrito</sub> <br>
    Esse texto está <sup>sobrescrito</sup> <br>

</body>
</html>
